<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>toko</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; background: #0f0f10; color: #eee; }
  h1 { font-weight: 600; }
  textarea { width: 100%; height: 120px; background: #1a1a1c; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 10px; font-family: monospace; }
  button { margin-top: 10px; padding: 10px 18px; border-radius: 8px; border: none; background: #4f7cff; color: white; font-weight: 600; cursor: pointer; }
  button:hover { background: #3d69f0; }
  .item { border: 1px solid #2a2a2c; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .status { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
  .status.done { color: #6ee88a; }
  .status.error { color: #ff6b6b; }
  a.dl { color: #4f7cff; }
</style>
</head>
<body>
  <h1>toko</h1>
  <p>paste one or more urls, one per line. batch download, no waiting for one to finish before the next starts.</p>
  <textarea id="urls" placeholder="https://youtube.com/watch?v=...
https://youtube.com/watch?v=..."></textarea>
  <br />
  <button id="go">download all</button>
  <div id="results"></div>

<script>
const go = document.getElementById("go");
const results = document.getElementById("results");

go.addEventListener("click", async () => {
  const urls = document.getElementById("urls").value
    .split("\n").map(s => s.trim()).filter(Boolean);
  if (!urls.length) return;

  results.innerHTML = "";
  const res = await fetch("/api/batch", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ urls })
  });
  const { batchId, error } = await res.json();
  if (error) { results.textContent = error; return; }

  poll(batchId);
});

function poll(batchId) {
  const interval = setInterval(async () => {
    const res = await fetch(`/api/batch/${batchId}`);
    const batch = await res.json();
    render(batch);
    if (batch.items.every(i => i.status === "done" || i.status === "error")) {
      clearInterval(interval);
    }
  }, 800);
}

function render(batch) {
  results.innerHTML = batch.items.map(item => `
    <div class="item">
      <div class="status ${item.status}">${item.status}</div>
      <div>${item.url}</div>
      ${item.result ? `
        <div>${item.result.title}</div>
        ${item.result.formats.slice(0, 5).map(f => `<a class="dl" href="${f.url}" target="_blank">${f.label}</a><br/>`).join("")}
      ` : ""}
      ${item.error ? `<div style="color:#ff6b6b">${item.error}</div>` : ""}
    </div>
  `).join("");
}
</script>
</body>
</html>
